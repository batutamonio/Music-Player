# Compila la versión modificada, la firma con tu clave y la publica en "Releases".
# Se lanza sola al subir cambios a main, o a mano desde la pestaña Actions ("Run workflow").
name: Compilar APK (mod)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mod
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mod.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/mod.keystore" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          BASE_VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          # el número de versión sube en cada compilación para que el móvil acepte la actualización
          ./gradlew assembleFossRelease --no-daemon \
            -PVERSION_CODE=$((1000 + ${{ github.run_number }})) \
            -PVERSION_NAME="${BASE_VERSION}-mod.${{ github.run_number }}"

      - name: Borrar la clave del servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/mod.keystore"

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mod-${{ github.run_number }}" app/build/outputs/apk/foss/release/*.apk \
            --title "Música (mod) #${{ github.run_number }}" \
            --notes "Compilado desde ${{ github.sha }}"
